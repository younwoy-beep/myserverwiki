<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Con Đường Armageddon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d17;--panel:#131a33;--panel2:#1a2347;--line:#2a3664;--text:#e8ecff;--mute:#8f9bc6;--gold:#f4c453;--azure:#58cbff;--ac:#f4c453}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font:17px/1.65 Spectral,Georgia,serif;overflow:hidden;
 background:radial-gradient(1100px 560px at 15% -12%,#1d2a63 0,transparent 62%),radial-gradient(800px 480px at 105% 0,#3b1c52 0,transparent 60%),var(--bg)}
h1,h2,h3,h4{font-family:"Cormorant Garamond",Georgia,serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
.top{height:64px;display:flex;align-items:center;gap:20px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(10,13,23,.8);backdrop-filter:blur(6px)}
.top h1{font-size:1.9rem;color:var(--gold);white-space:nowrap;letter-spacing:.01em}
.meter{flex:1;max-width:420px;margin-left:auto}
.bar{height:8px;border-radius:99px;background:#0d1226;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7a5cff,var(--azure),var(--gold));transition:width .6s}
.meter span{display:block;font-size:.82rem;color:var(--mute);margin-top:3px;text-align:right}
.reset{all:unset;cursor:pointer;color:var(--mute);font-size:.85rem;text-decoration:underline;white-space:nowrap}
.reset:hover{color:var(--text)}
.app{display:grid;grid-template-columns:268px 1fr;height:calc(100% - 64px)}
#tabs{overflow:auto;padding:18px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:rgba(10,13,23,.45)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid transparent;color:var(--mute)}
.tab b{font:700 1.12rem "Cormorant Garamond",serif;color:var(--text)}
.tab em{font-style:normal;font-size:.8rem;background:#0d1226;border:1px solid var(--line);border-radius:99px;padding:0 9px}
.tab em:empty{display:none}
.tab .e{font-size:1.35rem;text-align:center}
.tab:hover,.tab:focus-visible{background:var(--panel);outline:none;border-color:var(--line)}
.tab.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.tab.on em{color:var(--c);border-color:var(--c)}
.tabs-h{margin:14px 6px 2px;font-size:.78rem;color:var(--mute)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{padding:16px 26px 8px}
.chead h2{font-size:2rem;color:var(--ac)}
.chead p{margin:2px 0 0;color:var(--mute);font-size:.95rem;max-width:56em}
#canvas{flex:1;overflow:auto;position:relative;cursor:default;
 background-image:linear-gradient(rgba(120,140,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,220,.06) 1px,transparent 1px);background-size:40px 40px}
#canvas.grab{cursor:grabbing}
#tree{position:relative}
#edges{position:absolute;inset:0;pointer-events:none}
.ed{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:6 8}
.ed.done{stroke:var(--gold);stroke-dasharray:none;filter:drop-shadow(0 0 5px rgba(244,196,83,.55))}
.ed.now{stroke:var(--azure);animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.node{all:unset;box-sizing:border-box;position:absolute;width:140px;text-align:center;cursor:pointer}
.tile{position:relative;width:76px;height:76px;margin:0 auto;border-radius:20px;display:grid;place-items:center;font-size:2rem;
 background:linear-gradient(150deg,var(--panel2),#0e1430);border:3px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tile img{width:44px;height:44px;image-rendering:pixelated}
.nm{display:block;margin-top:8px;font:700 1.08rem/1.15 "Cormorant Garamond",serif;color:var(--text)}
.sb{display:block;font-size:.76rem;color:var(--mute)}
.node:hover .tile,.node:focus-visible .tile{border-color:#fff;transform:translateY(-2px)}
.node.done .tile{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,196,83,.15),0 0 22px rgba(244,196,83,.35)}
.node.done .tile::after{content:"✔";position:absolute;right:-9px;bottom:-9px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#241a02;font-size:.9rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.node.now .tile{border-color:var(--azure);animation:glow 2.2s ease-in-out infinite}
.node.open .tile{border-color:var(--ac)}
.node.lock{opacity:.5}.node.lock .tile{filter:grayscale(.85)}
.node.gate .tile{width:56px;height:56px;border-radius:50%;border-style:dashed}
.node.gate .tile img{width:32px;height:32px}
.node.gate .nm{font-size:.92rem;font-weight:600;color:var(--mute)}
.d3{position:absolute;left:-8px;top:-8px;font:700 .68rem Spectral,serif;background:var(--ac);color:#10121f;border-radius:99px;padding:0 6px}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(88,203,255,.15),0 0 28px 4px rgba(88,203,255,.55)}}
@media (prefers-reduced-motion:reduce){.node.now .tile,.ed.now{animation:none}.bar i{transition:none}}
.guide{max-width:760px;margin:6px 26px 40px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px}
.card h3{color:var(--gold);font-size:1.4rem;margin-bottom:4px}
.card p,.card ul{margin:4px 0}.card ul{padding-left:20px}
@media (max-width:820px){
 body{overflow:auto}.top{height:auto;flex-wrap:wrap;padding:10px 14px}.top h1{font-size:1.5rem}.meter{max-width:none;flex-basis:100%;margin:0}
 .app{grid-template-columns:1fr;height:auto}#tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
 .tab{grid-template-columns:auto auto auto;white-space:nowrap}.tabs-h{display:none}
 #canvas{height:70vh}.chead{padding:12px 16px 6px}.guide{margin:6px 14px 30px}}
/* Hồ sơ */
dialog{width:min(660px,94vw);max-height:90vh;overflow:auto;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);box-shadow:0 30px 100px #000}
dialog::backdrop{background:rgba(4,6,14,.82)}
.dh{display:flex;gap:18px;align-items:center;padding:22px 28px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line)}
.dh h3{font-size:2rem;color:var(--gold)}.dh small{color:var(--mute);font-style:italic}
.dh img{width:72px;height:72px;flex:none;image-rendering:pixelated}
.db{padding:6px 28px 26px}
.db h4{font-size:1.25rem;color:var(--azure);margin:18px 0 2px}
.db p{margin:2px 0}.db .lore{font-style:italic;color:#cdd5f5}
.sum{display:flex;gap:14px;align-items:center}
.sum img{width:52px;height:52px;flex:none;image-rendering:pixelated;background:#0d1226;border:1px solid var(--line);border-radius:10px;padding:5px}
.v3d{margin:14px 0 4px}
#vhost{height:300px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 50% 38%,#26305f,#0b0f22 78%)}
.v3d small{display:block;text-align:center;margin-top:4px;color:var(--mute);font-style:italic}
.vtabs{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.vtab{cursor:pointer;padding:3px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mute)}
.vtab.on{background:var(--azure);border-color:var(--azure);color:#06101c;font-weight:600}
.v3err{padding:60px 20px;text-align:center;color:var(--mute)}
.act{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.act button{cursor:pointer;padding:9px 22px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#241a02;font-weight:600}
.act button.ghost{background:transparent;color:var(--gold)}
.act button:hover,.act button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <h1>Con Đường Armageddon</h1>
  <div class="meter"><div class="bar"><i id="fill"></i></div><span id="pct"></span></div>
  <button class="reset" id="reset">Xóa tiến độ</button>
</header>
<div class="app">
  <nav id="tabs" aria-label="Các chương"></nav>
  <main>
    <div class="chead"><h2 id="ctitle"></h2><p id="cdesc"></p></div>
    <div id="canvas"><div id="tree"><svg id="edges"></svg><div id="nodes"></div></div></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><img id="dimg" alt=""><div><h3 id="dt"></h3><small id="ds"></small></div></div>
  <div class="db" id="dbody"></div>
</dialog>
<script>
// [tên, danh hiệu, biểu tượng, bậc, lời văn, vật triệu hồi, công thức, mở khóa, mẹo]
const S=[
["Iron Colossus","Cự Nhân Sắt","⚙️","Bậc Sắt","Kẻ gác cổng đầu tiên của vương quốc, một pho tượng sắt rỉ máu đứng chặn lối tới mọi kim loại. Chừng nào hắn còn đứng, thép vẫn chỉ là giấc mơ.","Iron Remote","4 thỏi sắt và 1 bông hoa bất kỳ","Sắt: quặng, công cụ, giáp.","Giữ lại Colossal Iron Ingot trong túi kho báu, chặng sau cần đến."],
["Goblin Lord","Chúa Tể Goblin","💰","Bậc Vàng","Chúa tể của lũ goblin tham lam, ngự trên núi vàng cướp được. Một đồng xu lạ sẽ đánh thức hắn khỏi giấc ngủ no nê.","Strange Coin","Colossal Iron Ingot và 4 thỏi vàng","Vàng: quặng, công cụ, giáp.","Dọn bớt goblin đi kèm trước khi dồn sức vào hắn."],
["Arion","Bạo Chúa Ngọc Lục Bảo","💚","Bậc Ngọc","Bạo chúa khoác sắc xanh ngọc bích, cơn thịnh nộ của hắn làm rung chuyển cả những ngôi làng. Cây totem là lời thách đấu.","Emerald Totem","4 ngọc lục bảo và 1 vàng thô","Ngọc lục bảo: quặng, công cụ, giáp.","Arion có hai dạng. Mang nhiều thuốc hồi và giáp chống nổ."],
["Eldorath","Kiến Trúc Sư Cổ Đại","🏛️","Bậc Kim Cương","Kiến trúc sư của thời đại xa xưa, người dựng cánh cổng Nether rồi khóa nó lại. Chỉ kẻ hạ được hắn mới có chìa.","Builder’s Stone","4 đá, 1 lapis, 1 thỏi sắt, 1 ngọc lục bảo, 1 bột đá đỏ, 1 thỏi vàng","Kim cương, đồ enchant, và cổng vào Nether.","Đây là cột mốc lớn: sau hắn, nhiều boss mod khác bắt đầu lộ diện."],
["Zoranth","Kẻ Bị Lãng Quên","🔥","Bậc Netherite","Vị thần bị thế gian lãng quên, ngọn lửa của hắn thiêu cả ký ức. Hắn canh giữ bí mật của hợp kim tối thượng.","Fiery Wither Skull","2 thạch anh, 4 netherrack, 1 xô dung nham, 2 nether wart, 1 kim cương","Netherite: quặng, công cụ, giáp.","Mang thuốc kháng lửa và giáp kim cương đã enchant."],
["Ender Dragon","Bóng Đen Cuối Của Thời Cũ","🐉","Hardmode","Khi con rồng gục ngã, Hardmode giáng xuống: mọi sinh vật hung hãn hơn, và những cánh cửa mới hé mở trong End.","Không cần","Vào The End (xem cách kích hoạt cổng trong mod End Remastered)","Hardmode, và End City chứa Ancient Blueprint.","Sau khi hạ rồng, hãy lục soát End City để lấy Ancient Blueprint."],
["Elvenite Paladin","Hiệp Sĩ Thánh Tinh Linh","🛡️","Bậc Elvenite","Hiệp sĩ thánh của tộc tinh linh, thanh kiếm sáng rực lời thề. Hắn chỉ công nhận kẻ từng đánh bại Rồng.","Titan’s Insigna","4 Khyros Tear, 4 Gilded Plate, 1 Ancient Blueprint","Elvenite: quặng, công cụ, giáp.","Hắn nhanh và hay nhảy. Giữ khoảng cách, dùng khiên."],
["Vaedric","Lữ Khách Sa Ngã","🗡️","Bậc Voiderite","Kẻ lữ hành sa ngã mang theo mảnh vỡ của Hư Không. Những thanh kiếm của hắn không bao giờ chạm đất.","Wanderer’s Fallen Shard","4 đá End, 4 ngọc ender, 1 thỏi Elvenite","Voiderite: quặng, công cụ, giáp.","Né theo nhịp kiếm bay, đánh gần khi hắn lộ sơ hở."],
["Bringer of Doom","Điềm Báo Tận Thế","☠️","Đại Tai Họa","Điềm báo của ngày tận thế, mang hai hình hài trong hai pha chiến đấu. Khi hắn gục, cánh cổng tới các Tai Họa mở ra.","The Key of Doom","1 khối đá đỏ, 1 Voiderite, 1 mảnh sắt (xếp dọc)","Sigil of Calamity, vật gọi Ba Tai Họa.","Chuẩn bị cho hai pha. Hồi đầy trước khi vào pha hai."],
["Ba Tai Họa","Chaos, Famine, Discord","🌪️","Đại Tai Họa","Chaos, Famine và Discord hợp thành cơn bão cuối cùng. Chỉ khi Discord im lặng, linh hồn mới được giải thoát.","Sigil of Calamity","Rơi ra từ Bringer of Doom","Linh hồn, và Calamitous Core.","Hạ lần lượt từng Tai Họa, đừng gọi dồn."],
["Sanghor","Lãnh Chúa Máu","🩸","Bậc Máu","Lãnh chúa của máu, kẻ hồi sinh bằng sinh mạng đối thủ. Kén máu nở ra là lúc cuộc săn bắt đầu.","Cocoon of Blood","1 trứng, 1 Calamitous Core, 1 nether wart","Đồ Bloody.","Hắn hút máu để hồi. Ưu tiên sát thương cao, đừng kéo dài trận đánh."],
["Zoranth Newborn","Đứa Con Của Thiên Đỉnh","☀️","Bậc Mặt Trời","Đứa con mới sinh của Thiên Đỉnh, rạng rỡ và tàn khốc như mặt trời giữa trưa.","Sun Emblem","4 thỏi Bloody và 1 hoa hướng dương","Đồ Helionite.","Hắn có thể đổi ngày đêm. Mang sẵn thuốc hồi và né đòn tia."],
["Nyxaris","Tấm Màn Lãng Quên","🌑","Bậc Bóng Tối","Bóng tối cuối cùng của biên niên sử. Nyxaris phủ màn lãng quên lên mọi thứ chạm đến.","Corrupted Tear","1 thỏi Helionite, 4 than, 1 Khyros Tear","Đồ Shadow. Hết đường chính.","Thử thách cuối cùng: mang trang bị tốt nhất và đủ thuốc."]
];
// [bậc cần hạ (chỉ số), nhóm, các boss]

[0,"Terraria","King Slime, Eye of Cthulhu"],
[1,"Terraria","Queen Bee, Eater of Worlds, Brain of Cthulhu"],

const pic=(k,alt)=>IMG[k]?`<img src="${IMG[k]}" alt="${alt||""}">`:"";
const SK={"Yeti":"yeti","Sandworm":"sandworm","Kraken":"kraken","Pirate Captain":"pirate","Infernal Dragon":"infernal_dragon","Underworld Knight":"underworld_knight","Ogre Lord":"ogre_lord","Umvuthi":"umvuthi","Sculptor":"sculptor","Ferrous Wroughtnaut":"wroughtnaut","Frostmaw":"frostmaw","Prime Ender Dragon":"prime_ender_dragon","Skeletron Prime":"skeletron_prime"};
const skey=n=>SK[n.replace(/ \(.*\)/,"")];

let done=new Set(),sdone=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("armageddon")||"[]"))}catch(e){}
try{sdone=new Set(JSON.parse(localStorage.getItem("armageddon_side")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("armageddon",JSON.stringify([...done]))}catch(e){}};
const ssave=()=>{try{localStorage.setItem("armageddon_side",JSON.stringify([...sdone]))}catch(e){}};
const $=id=>document.getElementById(id);
const cur=()=>{for(let i=0;i<S.length;i++)if(!done.has(i))return i;return -1};
const HAS=[0,1,2,3,4,6,7,8,9,10,11,12];
let MODELS=null,LIB=null,VW=null;
let SIDE=null;
async function mount(get){
  const host=$("vhost"); if(!host)return;
  try{
    const list=await get();
    LIB=LIB||{THREE:await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"),V:await import("./viewer.js")};
    if(!list||!$("vhost")||!$("dlg").open)return;
    VW=LIB.V.createViewer(LIB.THREE,host);
    const tabs=$("vtabs");
    const pick=k=>{VW.show(list[k]);tabs.querySelectorAll(".vtab").forEach((b,j)=>b.classList.toggle("on",j===k))};
    if(list.length>1)tabs.innerHTML=list.map((m,k)=>`<button class="vtab" data-k="${k}">${m.name}</button>`).join("");
    tabs.onclick=e=>{const b=e.target.closest(".vtab");if(b)pick(+b.dataset.k)};
    pick(0);
  }catch(e){if($("vhost"))$("vhost").innerHTML='<p class="v3err">Không tải được mô hình 3D. Hãy mở trang qua GitHub Pages hoặc máy chủ web, không mở trực tiếp file.</p>'}
}
const load3d=i=>mount(async()=>(MODELS=MODELS||await (await fetch("models.json")).json())[i]);
const loadSide=k=>mount(async()=>(SIDE=SIDE||await (await fetch("models_side.json")).json())[k].variants);
function open_(i){
  if(VW){VW.destroy();VW=null}
  const s=S[i],d=$("dlg");
  $("dt").textContent=s[0];
  $("ds").textContent=s[1]+", "+s[3];
  $("dimg").src=IMG[A[i][0]]||"";$("dimg").hidden=!IMG[A[i][0]];
  $("dbody").innerHTML=`<p class="lore">${s[4]}</p>
    ${HAS.includes(i)?`<div class="v3d"><div id="vhost"></div><div class="vtabs" id="vtabs"></div><small>Kéo để xoay, cuộn chuột để phóng to. Mô hình và chuyển động nhàn rỗi lấy thẳng từ mod.</small></div>`:""}
    <h4>Vật triệu hồi</h4><div class="sum">${pic(A[i][1])}<p><b>${s[5]}</b>${s[6]?"<br>"+s[6]:""}</p></div>
    <h4>Chiến lợi phẩm</h4><p>Mở khóa: ${s[7]}</p>
    <h4>Lời khuyên</h4><p>${s[8]}</p>
    <div class="act"><button id="mark">${done.has(i)?"Hủy dấu hạ gục":"Đánh dấu đã hạ"}</button><button class="ghost" id="close">Đóng hồ sơ</button></div>`;
  $("mark").onclick=()=>{
    if(done.has(i)){for(let j=i;j<S.length;j++)done.delete(j)}
    else{for(let j=0;j<=i;j++)done.add(j)}
    save();render();d.close();
  };
  $("close").onclick=()=>d.close();
  d.showModal();
  load3d(i);
}

 {id:"cat",name:"Cataclysm",e:"🌋",c:"#ff8a4c",d:"Tám hầm ngục và tám boss của L_Ender’s Cataclysm. Hãy đi theo thứ tự gợi ý."},
 {id:"bfb",name:"Block Factory",e:"🏭",c:"#52b8ff",d:"Boss của Block Factory’s Bosses và các hầm ngục lân cận."},
 {id:"leg",name:"Mowzie và Huyền thoại",e:"🗿",c:"#c590ff",d:"Mowzie’s Mobs, Legendary Monsters và Kings and Monsters."},
 {id:"drg",name:"Rồng",e:"🐲",c:"#ff6584",d:"Ice and Fire: ba loài rồng và những kẻ canh giữ hang động."},
 {id:"van",name:"Boss vanilla",e:"⚔️",c:"#d3dcf5",d:"Những boss quen thuộc của Minecraft, nay cũng gắn với lộ trình."}
];
const GM={"Terraria":"ter","Cataclysm":"cat","Block Factory":"bfb","Hầm ngục":"bfb","Mowzie và Legendary Monsters":"leg","Huyền thoại":"leg","Ice and Fire":"drg","Rồng":"drg","Vanilla":"van"};
const SN=[];
H.forEach(h=>h[2].split(", ").forEach(n=>SN.push({name:n.replace(/ \(.*\)/,""),full:n,req:h[0],group:h[1],key:skey(n),ch:GM[h[1]]})));
const GUIDE=`<div class="guide">
<div class="card"><h3>Phong ấn theo bậc</h3><p>Chưa hạ kẻ gác cổng của bậc nào thì bạn chưa dùng được kim loại của bậc ấy: không đào quặng, không cầm công cụ, không mặc giáp. Cuốc sắt chạm đá mà không vỡ là phong ấn đang làm việc, không phải lỗi.</p></div>
<div class="card"><h3>Mỗi chặng đều giống nhau</h3><ul><li>Gom nguyên liệu của vật triệu hồi.</li><li>Chế vật triệu hồi, mang tới nơi thích hợp.</li><li>Hạ gục kẻ gác cổng và nhận túi kho báu.</li><li>Dùng kim loại mới để mạnh hơn rồi sang chặng sau.</li></ul></div>
<div class="card"><h3>Mười phút đầu tiên</h3><ul><li>Chặt gỗ, chế bàn chế tạo, cuốc đá và kiếm đá.</li><li>Tìm sắt trong rương hầm ngục hoặc từ Golem sắt ở làng, vì quặng sắt còn bị khóa.</li><li>Chế Iron Remote: 4 thỏi sắt và 1 bông hoa.</li><li>Mang nhiều thức ăn rồi đối mặt Cự Nhân Sắt.</li></ul></div>
<div class="card"><h3>Khi lạc đường</h3><p>Mở chương Con đường chính và nhìn nút đang phát sáng màu xanh: đó là bước kế tiếp của bạn. Sách Bách Khoa Armageddon trong hành trang giữ công thức đầy đủ.</p></div>
</div>`;
const GX=170,GY=132,PAD=34;
let chap="main",fresh=true;
function layout(id){
  const nodes=[],edges=[];
  if(id==="main"){
    const W=$("canvas").clientWidth||360, cols=Math.max(2,Math.min(6,Math.floor((W-PAD)/GX))), c0=cur();
    S.forEach((s,i)=>{const r=Math.floor(i/cols),k=i%cols;
      nodes.push({t:"m",i,x:PAD+(r%2?cols-1-k:k)*GX,y:PAD+r*GY,cls:done.has(i)?"done":i===c0?"now":"lock",nm:s[0],sb:s[3],ic:pic(A[i][0])||s[2]});
      if(i)edges.push([i-1,i,done.has(i)?"done":done.has(i-1)?"now":"lock"]);});
  }else{
    const list=SN.filter(n=>n.ch===id), reqs=[...new Set(list.map(n=>n.req))].sort((a,b)=>a-b), ch=CH.find(c=>c.id===id);
    reqs.forEach((q,c)=>{
      nodes.push({t:"g",i:q,id:"g"+q,x:PAD+c*GX,y:PAD,cls:"gate "+(done.has(q)?"done":"lock"),nm:S[q][0],sb:"cổng mở",ic:pic(A[q][0])||S[q][2]});
      if(c)edges.push(["g"+reqs[c-1],"g"+q,done.has(q)?"done":"lock"]);
      list.filter(n=>n.req===q).forEach((n,r)=>{
        const sd=sdone.has(n.name), un=done.has(q), id2="s"+n.name;
        nodes.push({t:"s",n,id:id2,x:PAD+c*GX,y:PAD+(r+1)*GY,cls:sd?"done":un?"open":"lock",nm:n.name,sb:n.group,ic:ch.e,d3:!!n.key});
        edges.push(["g"+q,id2,sd?"done":un?"now":"lock"]);});});
  }
  return{nodes,edges};
}
function render(){
  const c=CH.find(x=>x.id===chap)||CH[0];
  document.documentElement.style.setProperty("--ac",c.c);
  // tabs
  const cnt=id=>id==="main"?[done.size,S.length]:[SN.filter(n=>n.ch===id&&sdone.has(n.name)).length,SN.filter(n=>n.ch===id).length];
  $("tabs").innerHTML=`<button class="tab ${chap==="guide"?"on":""}" style="--c:#58cbff" data-c="guide"><span class="e">📜</span><b>Hướng dẫn</b><em></em></button><div class="tabs-h">Các chương</div>`+
    CH.map(x=>{const[a,b]=cnt(x.id);return `<button class="tab ${chap===x.id?"on":""}" style="--c:${x.c}" data-c="${x.id}"><span class="e">${x.e}</span><b>${x.name}</b><em>${a}/${b}</em></button>`}).join("");
  const n=done.size;
  $("fill").style.width=(n/S.length*100)+"%";
  $("pct").textContent=n===S.length?"Vương quốc đã được giải phóng!":`${n} trên ${S.length} kẻ gác cổng đã ngã xuống`;
  if(chap==="guide"){
    $("ctitle").textContent="Hướng dẫn cho người mới"; $("cdesc").textContent="Đọc một lần là đủ để không lạc đường.";
    $("tree").style.cssText="";$("edges").innerHTML="";$("nodes").innerHTML=GUIDE;return;
  }
  $("ctitle").textContent=c.name; $("cdesc").textContent=c.d+(c.id!=="main"?" Mỗi cột mở sau khi bạn hạ kẻ gác cổng ở đầu cột.":"");
  const L=layout(chap), pos={}; let w=0,h=0;
  L.nodes.forEach(o=>{pos[o.t==="m"?o.i:o.id]=o;w=Math.max(w,o.x+140);h=Math.max(h,o.y+140)});
  w+=PAD;h+=PAD;
  $("tree").style.cssText=`width:${w}px;height:${h}px`;
  const E=$("edges"); E.setAttribute("width",w);E.setAttribute("height",h);
  E.innerHTML=L.edges.map(([a,b,st])=>{
    const p=pos[a],q=pos[b],ax=p.x+70,ay=p.y+38,bx=q.x+70,by=q.y+38,dx=(bx-ax)/2,dy=(by-ay)/2;
    const d=ay===by||ax===bx?`M${ax} ${ay}L${bx} ${by}`:Math.abs(bx-ax)>=Math.abs(by-ay)?`M${ax} ${ay}C${ax+dx} ${ay} ${bx-dx} ${by} ${bx} ${by}`:`M${ax} ${ay}C${ax} ${ay+dy} ${bx} ${by-dy} ${bx} ${by}`;
    return `<path class="ed ${st}" d="${d}"/>`}).join("");
  $("nodes").innerHTML=L.nodes.map((o,k)=>`<button class="node ${o.cls}" style="left:${o.x}px;top:${o.y}px" data-k="${k}" aria-label="${o.nm}"><span class="tile">${o.d3?'<span class="d3">3D</span>':""}${o.ic.startsWith("<img")?o.ic:o.ic}</span><span class="nm">${o.nm}</span><span class="sb">${o.sb}</span></button>`).join("");
  $("nodes").onclick=e=>{const b=e.target.closest(".node");if(!b)return;const o=L.nodes[+b.dataset.k];
    if(o.t==="m"||o.t==="g")open_(o.i);else openInfo(o.n)};
  if(fresh){fresh=false;const cv=$("canvas"),t=chap==="main"?L.nodes.find(o=>o.cls==="now")||L.nodes[0]:L.nodes[0];
    cv.scrollTo({left:Math.max(0,t.x-cv.clientWidth/2+70),top:Math.max(0,t.y-cv.clientHeight/2+60)})}
}
function openInfo(n){
  if(VW){VW.destroy();VW=null}
  const k=n.key,ok=done.has(n.req),m=sdone.has(n.name);
  $("dt").textContent=n.name;$("ds").textContent=n.group+", cuộc săn ngoài đường lớn";$("dimg").hidden=true;
  $("dbody").innerHTML=`${k?`<div class="v3d"><div id="vhost"></div><div class="vtabs" id="vtabs"></div><small>Kéo để xoay, cuộn chuột để phóng to. Mô hình lấy thẳng từ mod.</small></div>`:`<p class="lore">Chưa có mô hình 3D cho kẻ này.</p>`}
    <h4>Điều kiện</h4><p>${ok?"Đã mở, hãy chuẩn bị kỹ.":"Mở sau khi hạ "+S[n.req][0]+"."} Độ khó là ước lượng.</p>
    <div class="act"><button id="mark">${m?"Hủy dấu hạ gục":"Đánh dấu đã hạ"}</button><button class="ghost" id="close">Đóng</button></div>`;
  $("mark").onclick=()=>{m?sdone.delete(n.name):sdone.add(n.name);ssave();render();$("dlg").close()};
  $("close").onclick=()=>$("dlg").close();$("dlg").showModal();if(k)loadSide(k);
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;chap=b.dataset.c;fresh=true;try{history.replaceState(null,"","#"+chap)}catch(x){}render();$("canvas").scrollTo(0,0)});
$("dlg").addEventListener("close",()=>{if(VW){VW.destroy();VW=null}});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("reset").onclick=()=>{if(confirm("Xóa toàn bộ tiến độ đã đánh dấu?")){done=new Set();sdone=new Set();save();ssave();render()}};
const cv=$("canvas");let pd=null;
cv.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.target.closest(".node"))return;pd={x:e.clientX,y:e.clientY,l:cv.scrollLeft,t:cv.scrollTop};cv.setPointerCapture(e.pointerId);cv.classList.add("grab")});
cv.addEventListener("pointermove",e=>{if(pd){cv.scrollLeft=pd.l-(e.clientX-pd.x);cv.scrollTop=pd.t-(e.clientY-pd.y)}});
cv.addEventListener("pointerup",()=>{pd=null;cv.classList.remove("grab")});
let rz=0;addEventListener("resize",()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(chap==="main")render()})});
const hh=location.hash.slice(1);if(hh==="guide"||CH.some(x=>x.id===hh))chap=hh;else if(!done.size&&!sdone.size)chap="guide";
render();
</script>
</body>
</html>
